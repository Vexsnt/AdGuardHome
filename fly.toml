# fly.toml app configuration file generated for adguardhome-3elnfg on 2026-08-09T13:15:47Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'adguardhome-3elnfg'
primary_region = 'ams'

[build]
  [build.args]
    GO_VERSION = '1.26.2'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
